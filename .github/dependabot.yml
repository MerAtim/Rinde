version: 2
updates:
  # Acciones de GitHub fijadas por SHA: Dependabot propone la actualización
  # con el SHA nuevo y el comentario de versión.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      acciones:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      backend:
        update-types:
          - minor
          - patch
    ignore:
      # Mismo criterio que el frontend: los saltos mayores se hacen a propósito.
      # Las vulnerabilidades siguen cubiertas por pip-audit en cada PR.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      frontend:
        update-types:
          - minor
          - patch
    ignore:
      # Las versiones mayores no se proponen solas: un salto mayor puede cambiar
      # el comportamiento en runtime y la CI en verde no alcanza para darlo por
      # bueno sin leer las notas de la versión. Se hacen a propósito, uno por vez.
      # Las vulnerabilidades siguen cubiertas por npm audit en cada PR.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Solo versiones LTS de Node: el salto mayor se hace a propósito, en CI y en Docker a la vez.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
