version: 2
updates:
  # Acciones de GitHub fijadas por SHA: Dependabot propone la actualización
  # con el SHA nuevo y el comentario de versión.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      acciones:
        patterns:
          - "*"
