version: 2
updates:
  # Acciones de GitHub fijadas por SHA: Dependabot propone la actualización
  # con el SHA nuevo y el comentario de versión.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      acciones:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      backend:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      frontend:
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint y openapi-typescript todavía no soportan TypeScript 6 o superior.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
