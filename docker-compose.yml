name: rinde

# Entorno local completo: base de datos, migraciones, API y frontend.
# Uso: copiar .env.example a .env, completar y ejecutar `docker compose up --build`.
# Solo el frontend se publica, y únicamente en la interfaz local (127.0.0.1).

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-api-environment: &api-environment
  RINDE_ENVIRONMENT: ${RINDE_ENVIRONMENT:-development}
  RINDE_DATABASE_URL: postgresql+psycopg://rinde:${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}@db:5432/rinde
  # En Docker local se navega por HTTP: la cookie de sesión no puede llevar Secure.
  RINDE_SESSION_COOKIE_SECURE: ${RINDE_SESSION_COOKIE_SECURE:-false}

services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: rinde
      POSTGRES_USER: rinde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinde -d rinde"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Base solo para los tests de integración y para `alembic check`, que
  # necesitan un PostgreSQL de verdad. No se levanta con `docker compose up`:
  # hay que pedirla por su perfil, porque no hace falta para usar la app.
  #   docker compose --profile test up --detach --wait test-db
  # La contraseña es fija y está a la vista a propósito: la base no guarda nada
  # que importe y solo escucha en la interfaz local.
  test-db:
    profiles: [test]
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: rinde_test
      POSTGRES_USER: rinde
      POSTGRES_PASSWORD: solo_para_tests
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata-test:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rinde -d rinde_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: ./backend
    image: rinde/api:local
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    <<: *hardening
    restart: "no"

  api:
    build: ./backend
    image: rinde/api:local
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    <<: *hardening
    tmpfs:
      - /tmp
    restart: unless-stopped

  web:
    build: ./frontend
    image: rinde/web:local
    ports:
      - "127.0.0.1:${RINDE_WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    <<: *hardening
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
      - /etc/nginx/conf.d:uid=101,gid=101
    restart: unless-stopped

volumes:
  pgdata:
  pgdata-test:
